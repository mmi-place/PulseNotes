<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Flux d'installation personnelle PulseNotes sur o2switch</title>
  <desc id="desc">Le script téléchargé depuis install.sh récupère la dernière release GitHub, vérifie son empreinte, crée le sous-domaine, installe les fichiers et affiche le lien de configuration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7f3ea"/>
      <stop offset="1" stop-color="#ece7dc"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17181d" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4">
      <path d="m0 0 8 4-8 4z" fill="#5943c4"/>
    </marker>
    <style>
      .title { fill:#17181d; font:700 27px "Segoe UI", sans-serif; }
      .step { fill:#17181d; font:700 18px "Segoe UI", sans-serif; }
      .copy { fill:#5f626a; font:400 15px "Segoe UI", sans-serif; }
      .small { fill:#5f626a; font:400 13px "Segoe UI", sans-serif; }
      .number { fill:#fff; font:700 16px "Segoe UI", sans-serif; }
      .box { fill:#fffdf8; stroke:#d7d4cb; stroke-width:2; }
      .arrow { fill:none; stroke:#5943c4; stroke-width:3; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="760" rx="24" fill="url(#bg)"/>
  <text x="60" y="62" class="title">Installation personnelle PulseNotes · o2switch</text>
  <text x="60" y="92" class="copy">Le script installe le site depuis la dernière GitHub Release et conserve les données d'une installation existante.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="140" width="330" height="150" rx="16" class="box"/>
    <circle cx="94" cy="177" r="18" fill="#5943c4"/>
    <text x="94" y="183" text-anchor="middle" class="number">1</text>
    <text x="128" y="183" class="step">Lancer l'installateur</text>
    <text x="88" y="220" class="copy">Terminal cPanel :</text>
    <text x="88" y="248" class="small">curl -fsSL .../install.sh | bash</text>
    <text x="88" y="273" class="small">Le script demande confirmation.</text>
  </g>
  <path d="M390 215h70" class="arrow"/>

  <g filter="url(#shadow)">
    <rect x="460" y="140" width="330" height="150" rx="16" class="box"/>
    <circle cx="494" cy="177" r="18" fill="#5943c4"/>
    <text x="494" y="183" text-anchor="middle" class="number">2</text>
    <text x="528" y="183" class="step">Télécharger la release</text>
    <text x="488" y="220" class="copy">GitHub Release latest :</text>
    <text x="488" y="248" class="small">pulsenotes-personal.zip</text>
    <text x="488" y="273" class="small">+ fichier .sha256</text>
  </g>
  <path d="M790 215h70" class="arrow"/>

  <g filter="url(#shadow)">
    <rect x="860" y="140" width="280" height="150" rx="16" class="box"/>
    <circle cx="894" cy="177" r="18" fill="#5943c4"/>
    <text x="894" y="183" text-anchor="middle" class="number">3</text>
    <text x="928" y="183" class="step">Vérifier</text>
    <text x="888" y="220" class="copy">SHA-256</text>
    <text x="888" y="248" class="small">Puis vérifier index.html,</text>
    <text x="888" y="273" class="small">l'API et la syntaxe PHP.</text>
  </g>

  <path d="M1000 290v72H600" class="arrow"/>
  <g filter="url(#shadow)">
    <rect x="410" y="362" width="380" height="150" rx="16" class="box"/>
    <circle cx="444" cy="399" r="18" fill="#5943c4"/>
    <text x="444" y="405" text-anchor="middle" class="number">4</text>
    <text x="478" y="405" class="step">Créer et installer</text>
    <text x="438" y="442" class="copy">Créer pulsenotes.&lt;domaine&gt;</text>
    <text x="438" y="470" class="small">Installer les fichiers, générer la clé,</text>
    <text x="438" y="495" class="small">protéger config.php et data/.</text>
  </g>
  <path d="M600 512v62" class="arrow"/>
  <g filter="url(#shadow)">
    <rect x="350" y="574" width="500" height="132" rx="16" fill="#fff8cf" stroke="#d4a900" stroke-width="3"/>
    <text x="600" y="612" text-anchor="middle" class="step">5 · Configuration finale</text>
    <text x="600" y="642" text-anchor="middle" class="copy">Attendre HTTPS/AutoSSL si nécessaire, puis ouvrir</text>
    <text x="600" y="670" text-anchor="middle" class="step">https://pulsenotes.&lt;domaine&gt;</text>
    <text x="600" y="694" text-anchor="middle" class="small">Configurer le compte UVSQ et l'accès local.</text>
  </g>
</svg>
