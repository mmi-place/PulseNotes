name: Publier une version

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/package-lock.json
      - name: Préparer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: curl, zip, pdo_sqlite
      - name: Tester le proxy PHP
        run: php php/tests/router_test.php
      - name: Installer les dépendances
        working-directory: src
        run: npm ci
      - name: Tester le frontend
        working-directory: src
        run: npm run check
      - name: Construire les distributions
        shell: pwsh
        run: ./scripts/build-release.ps1 all
      - name: Préparer la publication
        id: release_meta
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            "tag=$env:GITHUB_REF_NAME" >> $env:GITHUB_OUTPUT
            "name=$env:GITHUB_REF_NAME" >> $env:GITHUB_OUTPUT
            "prerelease=false" >> $env:GITHUB_OUTPUT
          } else {
            $currentVersion = (Get-Content src/package.json -Raw | ConvertFrom-Json).version
            $headers = @{
              Accept = 'application/vnd.github+json'
              Authorization = "Bearer $env:GITHUB_TOKEN"
              'X-GitHub-Api-Version' = '2022-11-28'
            }
            $latestStableTag = ''
            try {
              $latestRelease = Invoke-RestMethod `
                -Headers $headers `
                -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/latest"
              $latestStableTag = [string]$latestRelease.tag_name
            } catch {
              Write-Host "Aucune release stable précédente détectée."
            }
            if ($currentVersion -and $latestStableTag -ne "v$currentVersion") {
              "tag=v$currentVersion" >> $env:GITHUB_OUTPUT
              "name=v$currentVersion" >> $env:GITHUB_OUTPUT
              "prerelease=false" >> $env:GITHUB_OUTPUT
            } else {
              "tag=main-$env:GITHUB_RUN_NUMBER" >> $env:GITHUB_OUTPUT
              "name=Build main $env:GITHUB_RUN_NUMBER" >> $env:GITHUB_OUTPUT
              "prerelease=true" >> $env:GITHUB_OUTPUT
            }
          }
      - name: Publier les archives GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release_meta.outputs.name }}
          prerelease: ${{ steps.release_meta.outputs.prerelease }}
          body_path: .github/release-notes.md
          files: |
            output/pulsenotes-global.zip
            output/pulsenotes-global.zip.sha256
            output/pulsenotes-personal.zip
            output/pulsenotes-personal.zip.sha256
            output/install-personal-o2switch.sh
