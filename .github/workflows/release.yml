name: Publier une version

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/package-lock.json
      - name: Installer les dépendances
        working-directory: src
        run: npm ci
      - name: Tester le frontend
        working-directory: src
        run: npm run check
      - name: Construire les distributions
        shell: pwsh
        run: ./scripts/build-release.ps1 all
      - name: Publier les archives GitHub
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            output/releases/pulsenotes-global.zip
            output/releases/pulsenotes-global.zip.sha256
            output/releases/pulsenotes-personal.zip
            output/releases/pulsenotes-personal.zip.sha256
            output/releases/install-personal-o2switch.sh
