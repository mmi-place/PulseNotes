name: Publier une version

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/package-lock.json
      - name: Installer les dépendances
        working-directory: src
        run: npm ci
      - name: Tester le frontend
        working-directory: src
        run: npm run check
      - name: Construire les distributions
        shell: pwsh
        run: ./scripts/build-release.ps1 all
      - name: Publier les archives GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('main-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Build main #{0}', github.run_number) }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          generate_release_notes: true
          files: |
            output/pulsenotes-global.zip
            output/pulsenotes-global.zip.sha256
            output/pulsenotes-personal.zip
            output/pulsenotes-personal.zip.sha256
            output/install-personal-o2switch.sh
